name: Publish to npm

# Publishes the package to npm whenever a GitHub Release is published.
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1 (newer than what setup-node ships).
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      # Fail early if the release tag (e.g. v0.7.0) doesn't match package.json.
      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} != package.json $PKG_VERSION"
            exit 1
          fi

      - run: npm publish
